[package]
name = "webfetch2"
version = "0.1.0"
edition = "2024"

[lib]
name = "webfetch2"
path = "src/lib.rs"

[dependencies]
anyhow = "1.0.100"
reqwest = "0.12.24"
rmcp = { version = "0.8.5", features = ["server", "transport-io"] }
schemars = "1.1.0"
serde = "1.0.228"
serde_json = "1.0.145"
tokio = { version = "1.48.0", features = ["full"] }
tracing = "0.1.41"
tracing-subscriber = { version = "0.3.20", features = ["env-filter"] }
url = "2.5.7"

[dev-dependencies]
insta = "1.43.2"
